[project]
name = "strix-framewok-validation"
version = "1.0.0"
description = "Development-only validation for a portable Agent Skill"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11", "mypy>=1.16", "bandit>=1.8", "pytest>=8.3", "PyYAML>=6.0", "types-PyYAML>=6.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests"]
